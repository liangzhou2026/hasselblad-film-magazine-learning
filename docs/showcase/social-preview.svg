<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="640" viewBox="0 0 1280 640">
  <title>Hasselblad Film Magazine Learning</title>
  <desc>Independent bilingual learning project. Explore 16 film magazines, with A12, A16 and A24 assembly demos. The original A12 mobile screenshot is shown in full.</desc>
  <rect width="1280" height="640" fill="#183a34"/>
  <rect x="858" width="422" height="640" fill="#e3e8df"/>
  <g font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif">
    <text x="64" y="74" fill="#b7d6c6" font-size="15" font-weight="700" letter-spacing="3">EXPLORE · ROTATE · LEARN</text>
    <g fill="#f5f2e8" font-size="56" font-weight="700" letter-spacing="-1.8">
      <text x="64" y="147">Hasselblad</text>
      <text x="64" y="210">Film Magazine</text>
      <text x="64" y="273">Learning</text>
    </g>
    <text x="64" y="333" fill="#d5e5dc" font-family="Noto Sans CJK SC, sans-serif" font-size="31" letter-spacing="1">哈苏胶片后背三维学习台</text>
    <rect x="64" y="365" width="68" height="4" fill="#d3af78"/>
    <g fill="#f5f2e8" font-size="23" letter-spacing="-.4">
      <text x="64" y="414">Explore 16 film magazine models</text>
      <text x="64" y="452">A12 / A16 / A24 assembly demos</text>
    </g>
    <text x="64" y="497" fill="#b7d6c6" font-size="17">Free in your browser · 中文 / English</text>
    <g fill="#b7c8bd" font-size="14">
      <text x="64" y="565">Independent community project · Educational approximations</text>
      <text x="64" y="590" font-family="Noto Sans CJK SC, sans-serif">独立社区项目 · 模型与动画为教学近似</text>
    </g>
  </g>
  <image x="940.915" y="28" width="256.17" height="554" preserveAspectRatio="xMidYMid meet" xlink:href="../../site/assets/a12-mobile.png"/>
  <text x="1069" y="615" text-anchor="middle" fill="#426054" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="13" letter-spacing=".35">ACTUAL MOBILE VIEW · 真实手机界面</text>
</svg>
